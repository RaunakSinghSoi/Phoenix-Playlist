name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Prepare VADER lexicon
        run: |
          python -c "import nltk; assert nltk.download('vader_lexicon', quiet=True)"
      - name: Compile Python modules
        run: python -m compileall -q backend models tests scripts
      - name: Run automated tests
        run: python -m pytest -q
      - name: Start application and check HTTP endpoints
        env:
          DEBUG: 'false'
        run: python scripts/smoke_test.py
